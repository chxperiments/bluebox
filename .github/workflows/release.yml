name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: v
        run: echo "version=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p dist
          # Pure Go (no cgo), so cross-compiling needs no toolchain setup.
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X bluebox/internal/cli.Version=${VERSION}" \
              -o "dist/bluebox" ./cmd/bluebox
            tar -czf "dist/bluebox_${VERSION}_linux_${arch}.tar.gz" \
              -C dist bluebox -C "$GITHUB_WORKSPACE" README.md
            rm dist/bluebox
          done
          cd dist && sha256sum *.tar.gz > checksums.txt && cat checksums.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Re-running a tag (a retag, or a manual dispatch) must not fail on
          # an existing release, so replace it rather than erroring.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION exists; replacing it"
            gh release delete "$VERSION" --yes
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
